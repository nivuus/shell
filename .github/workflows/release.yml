name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  # First, run all tests to ensure quality
  test:
    name: Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh bats

      - name: Setup test environment
        run: |
          echo "NIVUUS_SHELL_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run all tests
        run: |
          echo "Running smoke tests..."
          bats tests/unit/test_smoke.bats

          echo "Running unit tests..."
          bats tests/unit/

          echo "Running performance tests..."
          bats tests/performance/

      - name: Validate startup time requirement
        run: |
          output=$(bats tests/performance/test_startup.bats 2>&1)
          echo "$output"

          if echo "$output" | grep -q "ok 1 CRITICAL"; then
            echo "✅ Startup time requirement met (<300ms)"
          else
            echo "❌ Startup time requirement FAILED"
            exit 1
          fi

      - name: Validate ZSH syntax
        run: |
          echo "Validating all ZSH files..."
          zsh -n .zshrc

          for file in config/*.zsh themes/*.zsh; do
            echo "  Checking $file..."
            zsh -n "$file"
          done

          echo "✅ All ZSH files have valid syntax"

  # Create the release if tests pass
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    # Secrets cloisonnés dans un environnement protégé : un attaquant qui
    # obtient « contents: write », ou qui injecte une Action tierce dans un
    # AUTRE job, ne peut pas lire un secret d'environnement. La règle de
    # protection « réviseur requis » est activable plus tard dans les
    # réglages GitHub, sans changer une ligne de code (décision actée n° 1 :
    # signature automatique, pas d'attente manuelle par release).
    environment: release
    permissions:
      contents: write
      id-token: write        # attestation de provenance
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Calculate new version
        id: version
        run: |
          # Read current version from package.json
          CURRENT_VERSION=$(grep '"version"' package.json | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "Current version: $CURRENT_VERSION"

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Increment based on bump type
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          # Create new version
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Export for other steps
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Check if tag already exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "❌ Tag v${{ steps.version.outputs.version }} already exists!"
            exit 1
          fi
          echo "✅ Tag v${{ steps.version.outputs.version }} is available"

      - name: Synchronise version across .version, package.json and install.sh
        run: |
          V="${{ steps.version.outputs.version }}"
          printf '%s\n' "$V" > .version
          sed -i 's/"version": ".*"/"version": "'"$V"'"/' package.json
          # Plancher de version du script d'amorçage : il ne sert que quand
          # l'API GitHub est injoignable, mais s'il diverge il envoie les
          # nouvelles installations sur une release périmée.
          sed -i 's/^NIVUUS_PINNED_VERSION=".*"/NIVUUS_PINNED_VERSION="'"$V"'"/' install.sh

          # Vérification croisée : c'est elle qui manquait, et c'est elle qui
          # aurait signalé que le sed précédent ne remplaçait plus rien.
          test "$(cat .version)" = "$V"
          test "$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)" = "$V"
          test "$(sed -n 's/^NIVUUS_PINNED_VERSION="\(.*\)"/\1/p' install.sh | head -n1)" = "$V"
          echo "Version synchronisée : $V"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, generating changelog from all commits..."
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREVIOUS_TAG to HEAD..."
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create changelog content
          cat > RELEASE_NOTES.md << EOF
          ## What's Changed

          $COMMITS

          ## Installation

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/maximeallanic/nivuus-shell/v${{ steps.version.outputs.version }}/install.sh | sh
          \`\`\`

          Or download the release archive and extract it manually.

          ## Update

          If you have Nivuus Shell already installed with auto-update enabled:

          \`\`\`bash
          nivuus-update
          \`\`\`

          **Full Changelog**: https://github.com/maximeallanic/nivuus-shell/compare/${PREVIOUS_TAG}...v${{ steps.version.outputs.version }}
          EOF

          echo "✅ Generated changelog"
          cat RELEASE_NOTES.md

      - name: Create release archive
        run: |
          # Create a clean archive without .git directory
          mkdir -p release-assets

          # Create source archive
          tar --exclude='.git' \
              --exclude='release-assets' \
              --exclude='*.zwc' \
              --exclude='.github' \
              -czf release-assets/nivuus-shell-v${{ steps.version.outputs.version }}.tar.gz \
              .

          echo "✅ Created release archive"
          ls -lh release-assets/

      - name: Create documentation archive
        run: |
          # Bundle all documentation
          mkdir -p release-assets/docs
          cp -r doc/* release-assets/docs/ 2>/dev/null || true
          cp README.md release-assets/docs/

          # Create docs archive
          cd release-assets
          tar -czf nivuus-shell-docs-v${{ steps.version.outputs.version }}.tar.gz docs/
          rm -rf docs/

          echo "✅ Created documentation archive"
          ls -lh

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS

          echo "✅ Generated checksums"
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          KEY_ECDSA: ${{ secrets.NIVUUS_SIGNING_KEY_ECDSA }}
          KEY_SSH:   ${{ secrets.NIVUUS_SIGNING_KEY_SSH }}
        run: |
          set -euo pipefail
          umask 077

          # Garde-fou d'amorçage : tant que le trousseau public n'est pas
          # committé (procédure humaine, doc/SIGNING.md), on NE PUBLIE PAS.
          # Fail-closed : mieux vaut pas de release qu'une release que les
          # clients refuseraient.
          if ! ls keys/*.pem >/dev/null 2>&1; then
            echo "❌ keys/*.pem absent : le trousseau de release n'est pas encore en service."
            echo "   Voir doc/SIGNING.md, « Mise en service du trousseau réel »."
            exit 1
          fi
          if [ -z "${KEY_ECDSA:-}" ] || [ -z "${KEY_SSH:-}" ]; then
            echo "❌ Secrets de signature absents de l'environnement « release »."
            echo "   Voir doc/SIGNING.md, étape 3."
            exit 1
          fi

          keyfile="$(mktemp)"; sshkey="$(mktemp)"
          cleanup() {
            shred -u "$keyfile" "$sshkey" 2>/dev/null || rm -f "$keyfile" "$sshkey"
          }
          trap cleanup EXIT

          printf '%s' "$KEY_ECDSA" > "$keyfile"
          printf '%s\n' "$KEY_SSH" > "$sshkey"
          chmod 600 "$keyfile" "$sshkey"

          # Chemin primaire : ECDSA P-256 / SHA-256, DER.
          openssl dgst -sha256 -sign "$keyfile" \
              -out release-assets/SHA256SUMS.sig release-assets/SHA256SUMS

          # Chemin de repli : Ed25519 SSHSIG.
          #
          # PIÈGE DE COLLISION, mesuré et pas théorique : `ssh-keygen -Y sign X`
          # écrit « X.sig » — exactement le fichier que openssl vient de
          # produire, et il n'existe pas d'option de sortie portable. La sonde
          # de disponibilité (doc/SIGNING.md) s'est fait piéger par ce même
          # détail et a rapporté un « ssh-keygen KO » entièrement faux. On
          # signe donc depuis une COPIE, puis on renomme.
          cp release-assets/SHA256SUMS "$RUNNER_TEMP/sums"
          ssh-keygen -Y sign -f "$sshkey" -n nivuus-release "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums.sig" release-assets/SHA256SUMS.sshsig

          # Une troisième signature (GPG .asc pour les packagers, hors
          # périmètre) s'ajouterait ici : une étape, un secret de plus,
          # aucune restructuration.
          echo "✅ Signed SHA256SUMS (ECDSA + SSHSIG)"
          ls -l release-assets/

      - name: Verify before publishing
        run: |
          set -euo pipefail
          # Vérification avec la clé publique COMMITÉE, jamais avec celle
          # dérivée du secret. C'est ce qui rend structurellement
          # impossible de publier une release que les clients
          # refuseraient — la panne la plus probable de ce chantier :
          # rotation du secret sans commit de la clé publique.
          ok=0
          for pem in keys/*.pem; do
            if openssl dgst -sha256 -verify "$pem" \
                 -signature release-assets/SHA256SUMS.sig \
                 release-assets/SHA256SUMS >/dev/null 2>&1; then
              echo "✅ ECDSA verified against $pem"; ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { echo "❌ Aucune clé publique committée ne valide SHA256SUMS.sig"; exit 1; }

          ssh-keygen -Y verify -f keys/allowed_signers -I nivuus-release \
              -n nivuus-release -s release-assets/SHA256SUMS.sshsig \
              < release-assets/SHA256SUMS
          echo "✅ SSHSIG verified against keys/allowed_signers"

      - name: Verify with the real client code
        run: |
          set -euo pipefail
          # Deuxième filet, plus fort que le premier : on n'exécute pas
          # une commande openssl écrite pour l'occasion, on exécute LA
          # fonction que les utilisateurs exécuteront. Une divergence
          # entre le workflow et le client est ainsi impossible.
          sudo apt-get update && sudo apt-get install -y zsh
          rm -f config/*.zwc
          ENABLE_AUTOUPDATE=false NIVUUS_SHELL_DIR="$PWD" zsh -c '
            source config/20-autoupdate.zsh
            _nivuus_verify_signature release-assets/SHA256SUMS release-assets keys
            rc=$?
            [[ $rc -eq 0 ]] || { echo "❌ le client refuserait cette release (rc=$rc)"; exit 1 }
            echo "✅ le client accepte cette release"
          '

      - name: Commit version updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add package.json install.sh .version
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"

          echo "✅ Committed version updates"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

          echo "✅ Created and pushed tag v${{ steps.version.outputs.version }}"

      - name: Push version updates to master
        run: |
          git push origin HEAD:master
          echo "✅ Pushed version updates to master"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release-assets/*.tar.gz'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Nivuus Shell v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/*

          echo "✅ Created GitHub Release v${{ steps.version.outputs.version }}"

      - name: Release Summary
        run: |
          echo "## 🎉 Release v${{ steps.version.outputs.version }} Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "- Source archive (tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation archive" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256 checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [View Release](https://github.com/maximeallanic/nivuus-shell/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Archive](https://github.com/maximeallanic/nivuus-shell/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify the release on GitHub" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the auto-update mechanism" >> $GITHUB_STEP_SUMMARY
          echo "3. Announce the release to users" >> $GITHUB_STEP_SUMMARY
