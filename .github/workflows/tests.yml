name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Future: Add macOS support
        # os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Run smoke tests
        run: |
          bats tests/unit/test_smoke.bats

      - name: Run unit tests
        run: |
          bats tests/unit/

      - name: Run performance tests (CRITICAL <300ms)
        run: |
          bats tests/performance/

      - name: Validate startup time requirement
        run: |
          # Extract startup time from performance tests
          output=$(bats tests/performance/test_startup.bats 2>&1)
          echo "$output"

          # Check if startup test passed or was skipped (both are OK)
          if echo "$output" | grep -q "ok 1 CRITICAL"; then
            if echo "$output" | grep -q "# skip"; then
              echo "⏭️  Startup time test skipped in CI (use bin/benchmark locally)"
            else
              echo "✅ Startup time requirement met (<300ms)"
            fi
          else
            echo "❌ Startup time requirement FAILED"
            exit 1
          fi

      - name: Test count must never regress
        run: ./bin/test-count --check

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Tests"
            echo
            echo '```'
            ./bin/test-count
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  e2e:
    name: Installation E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: |
          bats tests/unit/test_lib_*.bats

      - name: Install / uninstall E2E
        run: |
          bats tests/e2e/test_nivuus_cli.bats tests/e2e/test_install_sh_compat.bats

      - name: Platform, deps and minimal-mode E2E
        run: |
          bats tests/e2e/test_platform.bats tests/e2e/test_with_deps.bats tests/e2e/test_minimal_mode.bats

      - name: Signature verification suite
        run: |
          rm -f config/*.zwc     # un .zwc périmé masquerait le module
          bats tests/unit/test_keys_repo.bats \
               tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_autoupdate_hard_refusal.bats \
               tests/unit/test_lib_keys.bats \
               tests/unit/test_lib_steps_keys.bats \
               tests/unit/test_lib_steps_verify_tools.bats

      - name: Signature E2E (forged release must be refused)
        run: |
          rm -f config/*.zwc
          bats tests/e2e/test_update_signature.bats \
               tests/e2e/test_install_keys.bats \
               tests/e2e/test_verify_key.bats

      - name: The two invariants must be present and green
        run: |
          # Garde-fou contre une suppression discrète : les tests qui
          # portent la propriété de sécurité ne doivent pas pouvoir
          # disparaître sans que la CI le dise.
          grep -q "INVARIANT: a forged archive with SHA256SUMS re-signed by an attacker key is REFUSED" \
            tests/unit/test_release_signature.bats
          grep -q "INVARIANT: no verification tool at all is REFUSED" \
            tests/unit/test_release_signature.bats
          grep -c "INVARIANT" tests/e2e/test_update_signature.bats

      - name: Reversibility (HOME must be bit-identical)
        run: |
          bats tests/e2e/test_reversibility.bats

  e2e-macos:
    name: Installation E2E (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: bats tests/unit/test_lib_*.bats tests/unit/test_helpers_portable.bats

      - name: Install / uninstall E2E
        run: bats tests/e2e/test_nivuus_cli.bats tests/e2e/test_install_sh_compat.bats tests/e2e/test_minimal_mode.bats

      - name: Signature suites (macOS = le cas « shasum, pas sha256sum »)
        run: |
          rm -f config/*.zwc
          bats tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_autoupdate_hard_refusal.bats \
               tests/unit/test_lib_keys.bats
          bats tests/e2e/test_update_signature.bats tests/e2e/test_install_keys.bats

      - name: Reversibility (HOME must be bit-identical)
        run: bats tests/e2e/test_reversibility.bats

  e2e-alpine:
    name: Installation E2E (Alpine / musl, no GNU coreutils)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: BOOTSTRAP git before checkout (Alpine has none)
        shell: sh
        # BOOTSTRAP : seule installation de paquet tolérée hors install-deps.sh,
        # et elle ne dure qu'une ligne. actions/checkout sait se rabattre sur
        # l'API REST quand git manque, mais ce chemin n'a jamais été exercé ici,
        # alors que l'ordre « paquets puis checkout » l'est depuis la phase 3.
        # On garde l'ordre prouvé ; tout le reste passe par l'action composite.
        run: apk add --no-cache git  # BOOTSTRAP

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: bats tests/unit/test_lib_*.bats tests/unit/test_helpers_portable.bats

      - name: Install / uninstall E2E
        run: bats tests/e2e/test_nivuus_cli.bats tests/e2e/test_minimal_mode.bats

      - name: No verification tool at all is refused (Alpine's real state)
        run: |
          # Mesuré (doc/SIGNING.md) : alpine:3.20 + zsh/git/curl n'a NI
          # openssl NI ssh-keygen. C'est donc ici, et nulle part ailleurs,
          # que le code de retour 2 (« aucun outil ») se joue en vrai.
          rm -f config/*.zwc
          bats tests/unit/test_lib_steps_verify_tools.bats

      - name: Signature suites (needs the tools it verifies)
        run: |
          # Les suites GÉNÈRENT leurs clés éphémères : sans openssl ni
          # ssh-keygen, elles n'ont rien à signer. On les installe donc
          # ici -- l'étape ci-dessus a déjà couvert l'Alpine nue.
          ./tests/ci/install-verify-tools.sh
          rm -f config/*.zwc
          bats tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_lib_keys.bats \
               tests/e2e/test_update_signature.bats

      - name: Reversibility (HOME must be bit-identical)
        run: bats tests/e2e/test_reversibility.bats

  lint:
    name: Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Validate ZSH syntax
        run: |
          echo "Validating .zshrc..."
          zsh -n .zshrc

          echo "Validating config files..."
          for file in config/*.zsh; do
            echo "  Checking $file..."
            zsh -n "$file"
          done

          echo "Validating theme files..."
          for file in themes/*.zsh; do
            echo "  Checking $file..."
            zsh -n "$file"
          done

          echo "✅ All ZSH files have valid syntax"
