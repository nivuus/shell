name: Tests

# Boucle rapide : ce que toute PR doit prouver, en ~5 min de temps mur.
# La matrice exhaustive (6 conteneurs + 2 runners) vit dans matrix.yml et ne
# tourne JAMAIS ici : six pulls d'image par PR coûteraient plus que tout le
# reste réuni, pour une information que le nightly donne déjà.

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Niveau 1 (unitaire) + intégration + budget de démarrage. ~2 min.
  unit:
    name: Unit + integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Smoke
        run: ./tests/ci/bats-run.sh tests/unit/test_smoke.bats

      - name: Unit
        run: |
          rm -f config/*.zwc     # un .zwc périmé masquerait le module
          ./tests/ci/bats-run.sh tests/unit/

      - name: Integration
        run: ./tests/ci/bats-run.sh tests/integration/

      - name: Packaging core unit suites
        run: |
          # Couvertes par « tests/unit/ » ci-dessus ; nommées ici pour qu'un
          # refactor de CI ne puisse pas les perdre en silence (même
          # dispositif que pour les suites de signature).
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/unit/test_lib_origin.bats \
               tests/unit/test_lib_selfpath.bats \
               tests/unit/test_zshrc_block_guard.bats \
               tests/unit/test_autoupdate_package_mode.bats \
               tests/unit/test_autoupdate_readonly_tree.bats \
               tests/unit/test_update_package_message.bats \
               tests/unit/test_cleanup_zwc_ownership.bats \
               tests/unit/test_manifest_rollback_activation.bats \
               tests/unit/test_manpage.bats

      - name: Documentation suites (the README is confronted to the repo)
        run: |
          # Couvertes par « tests/unit/ » ci-dessus ; nommées ici pour qu'un
          # refactor de CI ne puisse pas les perdre en silence, comme pour
          # la signature et l'empaquetage. Ce sont du grep pur : aucun
          # paquet, aucun conteneur, coût négligeable sur chaque PR.
          rm -f config/*.zwc     # les règles 5.1 et 5.10 lisent config/
          ./tests/ci/bats-run.sh tests/unit/test_readme_claims.bats \
               tests/unit/test_readme_badges.bats \
               tests/unit/test_docs_index.bats
          # tests/e2e/test_docs_install.bats tourne dans le job e2e ; nommé
          # ici pour la même raison : qu'on ne puisse pas le perdre.

      - name: The showcase rules must be present and green
        run: |
          # Garde-fou contre une suppression discrète : ce sont ces règles
          # qui rougissent quand le README recommence à mentir. Sans elles,
          # la réécriture pourrit en trois mois comme la précédente.
          grep -q "REGLE 5.1"  tests/unit/test_readme_claims.bats   # commandes citées
          grep -q "REGLE 5.2"  tests/unit/test_readme_claims.bats   # superlatifs
          grep -q "REGLE 5.3"  tests/unit/test_readme_claims.bats   # chiffre de démarrage
          grep -q "REGLE 5.4"  tests/unit/test_readme_badges.bats   # badges sans preuve
          grep -q "REGLE 5.5"  tests/unit/test_readme_claims.bats   # 200 lignes
          grep -q "REGLE 5.6"  tests/unit/test_docs_index.bats      # index et liens
          grep -q "REGLE 5.7"  tests/unit/test_readme_claims.bats   # unilinguisme
          grep -q "REGLE 5.9"  tests/unit/test_readme_claims.bats   # puces ancrées
          grep -q "REGLE 5.10" tests/unit/test_readme_claims.bats   # variables citées

      - name: Performance (startup budget is enforced, not observed)
        run: ./tests/ci/bats-run.sh tests/performance/

      - name: Startup budget holds without bytecode (package mode)
        run: |
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/performance/test_startup_without_zwc.bats

      - name: Test count must never regress
        run: ./bin/test-count --check

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Tests"
            echo
            echo '```'
            ./bin/test-count
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Niveaux 2, 3 et 4 sur la plateforme de référence. ~2 min.
  e2e:
    name: Installation E2E (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # tests/e2e/test_upgrade_from_v3.bats reconstruit l'installation
          # v3.0.0 depuis le TAG v3.0.0 ; sans les tags, son helper échoue
          # volontairement plutôt que de se taire.
          fetch-tags: true
          fetch-depth: 0

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: ./tests/ci/bats-run.sh tests/unit/test_lib_*.bats

      - name: End-to-end (install, uninstall, reversibility, level 4)
        run: |
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/e2e/

      - name: Signature verification suite
        run: |
          rm -f config/*.zwc     # un .zwc périmé masquerait le module
          ./tests/ci/bats-run.sh tests/unit/test_keys_repo.bats \
               tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_autoupdate_hard_refusal.bats \
               tests/unit/test_lib_keys.bats \
               tests/unit/test_lib_steps_keys.bats \
               tests/unit/test_lib_steps_verify_tools.bats

      - name: Signature E2E (forged release must be refused)
        run: |
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/e2e/test_update_signature.bats \
               tests/e2e/test_install_keys.bats \
               tests/e2e/test_verify_key.bats

      - name: Package mode E2E (no package manager involved)
        run: |
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/e2e/test_package_mode.bats \
               tests/e2e/test_enable_disable.bats \
               tests/e2e/test_doctor_package.bats \
               tests/e2e/test_nivuus_update_package.bats

      - name: System-mode suites (unprivileged layer)
        run: |
          rm -f config/*.zwc .zshrc.zwc
          ./tests/ci/bats-run.sh tests/unit/test_lib_system.bats \
               tests/unit/test_system_privileges.bats \
               tests/unit/test_manifest_modes.bats \
               tests/unit/test_manifest_symlink.bats \
               tests/unit/test_zshrc_reentrancy.bats \
               tests/unit/test_system_package_notice.bats \
               tests/unit/test_install_sh_system.bats \
               tests/unit/test_autoupdate_system_mode.bats \
               tests/unit/test_ci_system_matrix.bats \
               tests/unit/test_helper_fingerprint.bats \
               tests/integration/test_install_system.bats \
               tests/integration/test_uninstall_system.bats \
               tests/integration/test_system_dry_run.bats \
               tests/integration/test_system_probe.bats \
               tests/integration/test_update_system_message.bats
          sh -n tests/ci/run-system-target.sh

      - name: The two packaging invariants must be present and green
        run: |
          # Garde-fou contre une suppression discrète : les tests qui portent
          # les propriétés du chantier d'empaquetage ne doivent pas pouvoir
          # disparaître sans que la CI le dise. Même dispositif que pour la
          # signature.
          grep -q "INVARIANT: three interactive shells leave no update-check timestamp" \
            tests/e2e/test_package_mode.bats
          grep -q "INVARIANT: package removed while the activation remains leaves stderr empty" \
            tests/e2e/test_package_mode.bats
          grep -q "INVARIANT: a package install never schedules an async update check" \
            tests/unit/test_autoupdate_package_mode.bats
          grep -q "INVARIANT: nivuus-update exits 0 on a package install" \
            tests/unit/test_update_package_message.bats
          grep -q "INVARIANT: nivuus install never writes origin=package" \
            tests/unit/test_lib_origin.bats
          grep -c "INVARIANT" tests/e2e/test_package_mode.bats

      - name: The two invariants must be present and green
        run: |
          # Garde-fou contre une suppression discrète : les tests qui
          # portent la propriété de sécurité ne doivent pas pouvoir
          # disparaître sans que la CI le dise.
          grep -q "INVARIANT: a forged archive with SHA256SUMS re-signed by an attacker key is REFUSED" \
            tests/unit/test_release_signature.bats
          grep -q "INVARIANT: no verification tool at all is REFUSED" \
            tests/unit/test_release_signature.bats
          grep -c "INVARIANT" tests/e2e/test_update_signature.bats

          # Mode système : les invariants du chantier --system. Ils vivent
          # dans un script de conteneur et dans deux suites ; le grep est ce
          # qui empêche qu'on les retire pour faire passer la CI.
          grep -q "INVARIANT n° 1" tests/ci/run-system-target.sh
          grep -q "INVARIANT n° 2" tests/ci/run-system-target.sh
          grep -q "INVARIANT n° 4" tests/ci/run-system-target.sh
          grep -q "INVARIANT: la garde n'est PAS exportée" tests/unit/test_zshrc_reentrancy.bats
          grep -q "INVARIANT: une installation pour la machine ne touche AUCUN" \
            tests/integration/test_install_system.bats
          grep -q "INVARIANT: aucune ligne CHSH" tests/integration/test_install_system.bats
          grep -q "INVARIANT: retrait bit-exact" tests/integration/test_uninstall_system.bats
          grep -q "INVARIANT n° 3" tests/ci/run-system-target.sh
          grep -q "INVARIANT: jamais de double source" tests/e2e/test_system_user_override.bats
          grep -q "INVARIANT: la mise à jour système n'emprunte JAMAIS" \
            tests/e2e/test_system_update.bats
          # Le chemin destructif de l'auto-update ne doit jamais réapparaître
          # dans le noyau : sur un arbre système, ce serait une écriture
          # massive hors manifeste, en root.
          ! grep -q "_nivuus_perform_update" bin/nivuus

  # Niveau 2 sur macOS : étroit, car facturé x10. Première exécution réelle.
  e2e-macos:
    name: Installation E2E (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: ./tests/ci/bats-run.sh tests/unit/test_lib_*.bats tests/unit/test_helpers_portable.bats

      - name: Install / uninstall
        run: |
          ./tests/ci/bats-run.sh tests/e2e/test_nivuus_cli.bats \
               tests/e2e/test_install_sh_compat.bats \
               tests/e2e/test_minimal_mode.bats

      - name: Signature suites (macOS = le cas « shasum, pas sha256sum »)
        run: |
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_autoupdate_hard_refusal.bats \
               tests/unit/test_lib_keys.bats
          ./tests/ci/bats-run.sh tests/e2e/test_update_signature.bats tests/e2e/test_install_keys.bats

      - name: Reversibility (HOME must be bit-identical)
        run: ./tests/ci/bats-run.sh tests/e2e/test_reversibility.bats

  # Alpine reste sur la boucle rapide : seule cible sans coreutils GNU,
  # c'est là que les régressions de portabilité se voient en premier.
  e2e-alpine:
    name: Installation E2E (Alpine / musl)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    steps:
      - name: BOOTSTRAP git before checkout (Alpine has none)
        shell: sh
        # BOOTSTRAP : seule installation de paquet tolérée hors install-deps.sh,
        # et elle ne dure qu'une ligne. actions/checkout sait se rabattre sur
        # l'API REST quand git manque, mais ce chemin n'a jamais été exercé ici,
        # alors que l'ordre « paquets puis checkout » l'est depuis la phase 3.
        # On garde l'ordre prouvé ; tout le reste passe par l'action composite.
        run: apk add --no-cache git  # BOOTSTRAP

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: Library unit tests
        run: ./tests/ci/bats-run.sh tests/unit/test_lib_*.bats tests/unit/test_helpers_portable.bats

      - name: Install / uninstall
        run: ./tests/ci/bats-run.sh tests/e2e/test_nivuus_cli.bats tests/e2e/test_minimal_mode.bats

      - name: No verification tool at all is refused (Alpine's real state)
        run: |
          # Mesuré (doc/SIGNING.md) : alpine:3.20 + zsh/git/curl n'a NI
          # openssl NI ssh-keygen. C'est donc ici, et nulle part ailleurs,
          # que le code de retour 2 (« aucun outil ») se joue en vrai.
          # install-deps.sh n'installe délibérément aucun des deux.
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/unit/test_lib_steps_verify_tools.bats

      - name: Signature suites (needs the tools it verifies)
        run: |
          # Les suites GÉNÈRENT leurs clés éphémères : sans openssl ni
          # ssh-keygen, elles n'ont rien à signer. On les installe donc
          # ici -- l'étape ci-dessus a déjà couvert l'Alpine nue.
          ./tests/ci/install-verify-tools.sh
          rm -f config/*.zwc
          ./tests/ci/bats-run.sh tests/unit/test_release_signature.bats \
               tests/unit/test_autoupdate_sha256.bats \
               tests/unit/test_autoupdate_download.bats \
               tests/unit/test_lib_keys.bats \
               tests/e2e/test_update_signature.bats

      - name: Reversibility (HOME must be bit-identical)
        run: ./tests/ci/bats-run.sh tests/e2e/test_reversibility.bats

  lint:
    name: Syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-tests

      - name: ZSH syntax
        run: |
          zsh -n .zshrc
          for file in config/*.zsh themes/*.zsh; do
            zsh -n "$file"
          done

      - name: POSIX sh syntax (lib/, tests/ci/ and install.sh run under dash and busybox)
        run: |
          for file in lib/*.sh tests/ci/*.sh install.sh; do
            sh -n "$file"
          done

      - name: Workflow syntax
        uses: raven-actions/actionlint@v2
        with:
          # shellcheck désactivé : il rapporte des « info » de style sur des
          # workflows que ce plan ne possède pas (release.yml). Le lint de
          # structure, lui, est bloquant. Les scripts, eux, sont vérifiés
          # par les deux steps ci-dessus.
          flags: -shellcheck=
